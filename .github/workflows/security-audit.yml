name: Security Audit

# Runs the exact checks Grafana's marketplace review runs (plugin-validator with
# upstream config/publishing.yaml), on main every day. New advisories land
# continuously, so a clean PR check last week does not mean a clean review today.
# Findings open (or update) a single tracking issue; it is closed once clean.

'on':
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Daily plugin-validator audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run plugin-validator
        id: plugin-validator
        continue-on-error: true
        uses: ./.github/actions/plugin-validator

      - name: Upload raw audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports-${{ github.run_id }}
          path: |
            plugin-validator.txt
            plugin-validator.json
            plugin-validator.raw
          retention-days: 14

      - name: Build audit report
        id: report
        if: always()
        env:
          OUTCOME: ${{ steps.plugin-validator.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          errors=0
          if [ -f plugin-validator.json ] && jq -e . plugin-validator.json >/dev/null 2>&1; then
            errors=$(jq '[.["plugin-validator"]?[]?[]? | select((.Severity // "") | ascii_downcase == "error")] | length' plugin-validator.json)
          fi

          # A failed run with no parsable errors (build or tooling break) must not read as clean.
          if [ "$OUTCOME" = "success" ] && [ "$errors" -eq 0 ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## Security audit found issues"
            echo
            echo "Same checks as Grafana's plugin review (\`@grafana/plugin-validator\`, upstream \`publishing.yaml\`). Run: ${RUN_URL}"
            echo
            if [ "$errors" -gt 0 ]; then
              echo "### Blocking findings (${errors})"
              echo
              jq -r '."plugin-validator" // {} | to_entries[] | .value[]? | select((.Severity // "") | ascii_downcase == "error") | "- \(.Title // "Untitled finding") - \((.Detail // "No detail") | gsub("\\s*\\n\\s*"; " ")) (rule: \(.Name // "unknown"))"' plugin-validator.json | sort -u | sed -n '1,40p'
            else
              echo "plugin-validator failed without reporting parsable findings (build or tooling error). See the run logs."
            fi
          } > audit-report.md
          echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Open, update or close tracking issue
        if: always()
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.report.outputs.failed }}
        with:
          script: |
            const fs = require('node:fs');
            const title = '[Security Audit] Action required';
            const { owner, repo } = context.repo;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'security-audit', per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);

            if (process.env.FAILED === 'true') {
              const body = fs.readFileSync('audit-report.md', 'utf8');
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: ['security-audit'] });
              }
            } else if (process.env.FAILED === 'false' && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: 'Latest audit is clean. Closing.',
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }

      - name: Fail workflow on findings
        if: always() && steps.report.outputs.failed == 'true'
        run: |
          echo "Security audit detected issues. See the tracking issue and artifacts."
          exit 1
