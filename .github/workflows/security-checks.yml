name: Security Checks

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      plugin_archive:
        description: Plugin archive filename for validator input
        required: false
        default: jaops-yamcs-app.zip
        type: string

permissions:
  contents: read

jobs:
  security:
    name: plugin-validator (Grafana review parity)
    runs-on: ubuntu-latest
    outputs:
      has_findings: ${{ steps.pr-comment.outputs.has_findings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run gosec (repo-wide, informational)
        id: gosec
        # Matches Grafana's own plugin-validator go-sec pass: full repo scope,
        # HIGH severity, and never blocking (gosec is Warning-only upstream too).
        # This step is for fast/early visibility only; it never fails the job.
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          export PATH="$(go env GOPATH)/bin:$PATH"

          set +e
          gosec -quiet -severity high -fmt=json -out=gosec.json ./...
          gosec -quiet -severity high ./... | tee gosec.txt
          exit 0

      - name: Run plugin-validator
        id: plugin-validator
        continue-on-error: true
        uses: ./.github/actions/plugin-validator
        with:
          archive: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_archive || 'jaops-yamcs-app.zip' }}

      - name: Upload raw security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            gosec.txt
            gosec.json
            plugin-validator.txt
            plugin-validator.json
          retention-days: 14

      - name: Evaluate security status
        id: evaluate
        if: always()
        env:
          PLUGIN_VALIDATOR_OUTCOME: ${{ steps.plugin-validator.outcome }}
        run: |
          failed=false
          summary=""

          # gosec is intentionally excluded here: Grafana's own plugin-validator
          # go-sec pass is Warning-only (never blocking) at any severity, and our
          # standalone gosec step matches that - it's informational only now.

          if [ "$PLUGIN_VALIDATOR_OUTCOME" = "failure" ]; then
            failed=true
            summary="${summary}\n- plugin-validator reported blocking (error severity) findings or failed"
          fi

          {
            echo "failed=${failed}"
            echo "summary<<EOF"
            echo -e "${summary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build PR security comment from JSON
        id: pr-comment
        if: always() && github.event_name == 'pull_request'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          gosec_findings=0
          if [ -f gosec.json ] && jq -e . gosec.json >/dev/null 2>&1; then
            gosec_findings=$(jq '[.Issues[]?] | length' gosec.json)
          fi

          # plugin-validator now runs with reportAll:true (same as Grafana's own
          # review config), so OK/passing entries are present too - only count
          # error (blocking) and warning (informational, matches Grafana's own
          # report which also surfaces non-blocking items like sponsorshiplink).
          plugin_error_findings=0
          plugin_warning_findings=0
          if [ -f plugin-validator.json ] && jq -e . plugin-validator.json >/dev/null 2>&1; then
            plugin_error_findings=$(jq '[.["plugin-validator"]?[]?[]? | select((.Severity // "") | ascii_downcase == "error")] | length' plugin-validator.json)
            plugin_warning_findings=$(jq '[.["plugin-validator"]?[]?[]? | select((.Severity // "") | ascii_downcase == "warning")] | length' plugin-validator.json)
          fi

          total_findings=$((gosec_findings + plugin_error_findings + plugin_warning_findings))
          if [ "$total_findings" -eq 0 ]; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "<!-- security-checks-comment -->"
            echo "## Security checks found issues"
            echo
            echo "This PR introduced findings in automated security checks."
            echo
            echo "_This comment is updated when security results change and deleted when the latest security checks are clean._"
            echo "_Only plugin-validator error-severity findings block this check (this includes osv-scanner HIGH/CRITICAL on every lockfile, dev dependencies included), matching Grafana's own review gating. Everything else (gosec, plugin-validator warnings) is informational._"
            echo
            echo "| Scanner | Findings |"
            echo "|---|---:|"
            echo "| gosec (HIGH severity, informational) | ${gosec_findings} |"
            echo "| plugin-validator (error severity, blocking) | ${plugin_error_findings} |"
            echo "| plugin-validator (warning severity, informational) | ${plugin_warning_findings} |"
            echo
          } > pr-security-comment.md

          if [ "$gosec_findings" -gt 0 ]; then
            {
              echo "### gosec highlights (informational)"
              echo
              jq -r '.Issues[]? | "- \(.severity // "UNKNOWN") \(.rule_id // "RULE") in \(.file // "unknown file"):\(.line // 0) - \(.details // "No details")"' gosec.json | sed -n '1,15p'
              echo
            } >> pr-security-comment.md
          fi

          if [ "$plugin_error_findings" -gt 0 ]; then
            {
              echo "### plugin-validator highlights (blocking)"
              echo
              jq -r '."plugin-validator" // {} | to_entries[] as $an | $an.value[]? | select((.Severity // "") | ascii_downcase == "error") | "- \(.Title // "Untitled finding") - \(.Detail // "No detail") (rule: \(.Name // "unknown"))"' plugin-validator.json | sed -n '1,25p'
              echo
            } >> pr-security-comment.md
          fi

          if [ "$plugin_warning_findings" -gt 0 ]; then
            {
              echo "### plugin-validator highlights (informational)"
              echo
              jq -r '."plugin-validator" // {} | to_entries[] as $an | $an.value[]? | select((.Severity // "") | ascii_downcase == "warning") | "- \(.Title // "Untitled finding") - \(.Detail // "No detail") (rule: \(.Name // "unknown"))"' plugin-validator.json | sed -n '1,25p'
              echo
            } >> pr-security-comment.md
          fi

          {
            echo "<details><summary>Raw outputs</summary>"
            echo
            echo "- gosec JSON: artifact security-reports-${RUN_ID} / gosec.json"
            echo "- plugin-validator JSON: artifact security-reports-${RUN_ID} / plugin-validator.json"
            echo
            echo "</details>"
          } >> pr-security-comment.md

          echo "has_findings=true" >> "$GITHUB_OUTPUT"

      - name: Upload PR security comment
        if: always() && github.event_name == 'pull_request' && steps.pr-comment.outputs.has_findings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-comment-${{ github.run_id }}
          path: pr-security-comment.md
          retention-days: 1

      - name: Fail workflow on findings
        if: always() && steps.evaluate.outputs.failed == 'true'
        env:
          SECURITY_SUMMARY: ${{ steps.evaluate.outputs.summary }}
        run: |
          echo "security checks detected issues:"
          echo "$SECURITY_SUMMARY"
          exit 1

  security-comment:
    name: Report findings
    runs-on: ubuntu-latest
    needs: security
    if: always() && github.event_name == 'pull_request'
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Download PR security comment
        if: needs.security.outputs.has_findings == 'true'
        uses: actions/download-artifact@v4
        with:
          name: security-comment-${{ github.run_id }}
          path: .

      - name: Post PR security comment
        if: needs.security.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- security-checks-comment -->';
            const body = fs.readFileSync('pr-security-comment.md', 'utf8');
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Delete PR security comment when clean
        if: needs.security.outputs.has_findings == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- security-checks-comment -->';
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }
