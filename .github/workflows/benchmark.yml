name: Benchmark

on:
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize, reopened, labeled]
        branches:
            - master
            - main

permissions:
    contents: read

concurrency:
    group: benchmark-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    benchmark:
        name: Performance Benchmark
        runs-on: ubuntu-latest
        timeout-minutes: 20
        if: >-
            ${{
              github.event_name == 'workflow_dispatch' ||
              (
                github.event_name == 'pull_request' &&
                github.event.action != 'closed' &&
                contains(github.event.pull_request.labels.*.name, 'run-benchmark')
              )
            }}
        permissions:
            contents: write
            actions: read
            issues: write
            pull-requests: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go environment
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - uses: pnpm/action-setup@v3

            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install Yamcs quickstart
              run: git clone --depth 1 https://github.com/jaops-space/yamcs-quickstart.git /tmp/yamcs-quickstart

            - name: Start Yamcs quickstart
              working-directory: /tmp/yamcs-quickstart
              run: |
                  cd docker
                  docker compose up -d yamcs
                  timeout 90 bash -c 'until curl -fsS http://localhost:8090/api/instances >/dev/null; do sleep 2; done'

            - name: Install benchmark Python deps
              run: pip install -r scripts/benchmarks/requirements.txt

            - name: Determine PR base benchmark commit
              if: ${{ github.event_name == 'pull_request' }}
              id: benchmark-base
              run: |
                  if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
                    BASE_SHA="$(git merge-base HEAD^2 HEAD^1)"
                  else
                    git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
                    BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"
                  fi
                  echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

            - name: Checkout PR base benchmark source
              if: ${{ github.event_name == 'pull_request' }}
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.benchmark-base.outputs.sha }}
                  path: benchmark-base-source

            - name: Run PR base benchmark
              if: ${{ github.event_name == 'pull_request' }}
              id: run-baseline-benchmark
              continue-on-error: true
              working-directory: benchmark-base-source
              run: |
                  if [ ! -f scripts/benchmarks/benchmark_yamcs_streams.py ]; then
                    echo "Base commit has no Yamcs benchmark script; skipping baseline."
                    exit 0
                  fi
                  python3 scripts/benchmarks/benchmark_yamcs_streams.py \
                    --output-dir ../benchmark-output/baseline

            - name: Run performance benchmark
              id: run-benchmark
              continue-on-error: true
              run: |
                  pnpm run bench -- \
                    --baseline-results benchmark-output/baseline/yamcs-stream-results.json

            - name: Generate benchmark report files
              if: ${{ steps.run-benchmark.outcome == 'success' }}
              run: |
                  pnpm run bench:report -- \
                    --output-dir benchmark-output \
                    --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Read benchmark status
              if: ${{ steps.run-benchmark.outcome == 'success' }}
              id: benchmark-status
              run: |
                  python3 - <<'PY' >> "$GITHUB_OUTPUT"
                  import json
                  with open("benchmark-output/benchmark-status.json", encoding="utf-8") as fp:
                      status = json.load(fp)
                  print(f"status={status['status']}")
                  print(f"should_comment={str(status['should_comment']).lower()}")
                  print(f"should_fail={str(status['should_fail']).lower()}")
                  PY

            - name: Publish benchmark plot images for PR artifacts
              id: publish-plots
              if: >-
                  ${{
                    github.event_name == 'pull_request' &&
                    steps.run-benchmark.outcome == 'success' &&
                    steps.benchmark-status.outputs.should_comment == 'true'
                  }}
              continue-on-error: true
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');
                      const plotsDir = path.join('benchmark-output', 'plots');
                      const allPlots = fs.existsSync(plotsDir)
                        ? fs.readdirSync(plotsDir).filter((name) => name.endsWith('.png'))
                        : [];

                      if (allPlots.length === 0) {
                        core.setOutput('plots-base-url', '');
                        return;
                      }

                      const {owner, repo} = context.repo;
                      const prNumber = context.payload.pull_request.number;
                      const runId = context.runId;
                      const branch = `benchmark-artifacts-pr-${prNumber}`;
                      const prefix = `benchmark/run-${runId}/plots`;
                      const treeEntries = [];
                      for (const plot of allPlots) {
                        const source = path.join(plotsDir, plot);
                        const blob = await github.rest.git.createBlob({
                          owner,
                          repo,
                          content: fs.readFileSync(source).toString('base64'),
                          encoding: 'base64',
                        });
                        treeEntries.push({
                          path: `${prefix}/${plot}`,
                          mode: '100644',
                          type: 'blob',
                          sha: blob.data.sha,
                        });
                      }
                      const tree = await github.rest.git.createTree({
                        owner,
                        repo,
                        tree: treeEntries,
                      });
                      const commit = await github.rest.git.createCommit({
                        owner,
                        repo,
                        message: `Add Yamcs benchmark plots for PR #${prNumber}, run ${runId}`,
                        tree: tree.data.sha,
                        parents: [],
                      });
                      try {
                        await github.rest.git.updateRef({
                          owner,
                          repo,
                          ref: `heads/${branch}`,
                          sha: commit.data.sha,
                          force: true,
                        });
                      } catch (error) {
                        if (error.status !== 404) {
                          throw error;
                        }
                        await github.rest.git.createRef({
                          owner,
                          repo,
                          ref: `refs/heads/${branch}`,
                          sha: commit.data.sha,
                        });
                      }

                      core.setOutput('plots-base-url', `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${prefix}`);

            - name: Generate final benchmark PR comment
              if: ${{ steps.run-benchmark.outcome == 'success' }}
              run: |
                  pnpm run bench:report -- \
                    --output-dir benchmark-output \
                    --plots-base-url "${{ steps.publish-plots.outputs.plots-base-url }}" \
                    --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Upload benchmark artifacts
              id: upload-benchmark
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-${{ github.run_id }}
                  path: benchmark-output
                  retention-days: 14

            - name: Comment benchmark result
              if: >-
                  ${{
                    github.event_name == 'pull_request' &&
                    steps.run-benchmark.outcome == 'success' &&
                    steps.benchmark-status.outputs.should_comment == 'true'
                  }}
              continue-on-error: true
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- jaops-yamcs-benchmark-report -->';
                      const body = fs.readFileSync('benchmark-output/benchmark-comment.md', 'utf8');
                      const {owner, repo} = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner,
                        repo,
                        issue_number,
                        per_page: 100,
                      });
                      const existingComments = comments.filter((comment) => comment.body && comment.body.includes(marker));
                      const existing = existingComments[0];
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner,
                          repo,
                          comment_id: existing.id,
                          body,
                        });
                        for (const duplicate of existingComments.slice(1)) {
                          await github.rest.issues.deleteComment({
                            owner,
                            repo,
                            comment_id: duplicate.id,
                          });
                        }
                      } else {
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number,
                          body,
                        });
                      }

            - name: Fail benchmark on threshold failure
              if: ${{ steps.benchmark-status.outputs.should_fail == 'true' }}
              run: exit 1
