name: Benchmark

on:
    pull_request:
        types: [opened, synchronize, reopened, labeled]
        branches:
            - master
            - main
            - feature/multi-parameter-stream-model
    push:
        branches:
            - master
            - main

permissions:
    contents: read

concurrency:
    group: benchmark-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    resolve-base:
        name: Resolve benchmark base
        runs-on: ubuntu-latest
        # Keep unlabeled PRs quiet in the PR checks UI. The rest of the benchmark
        # jobs depend on this job instead of carrying their own label gate, so a
        # skipped resolve-base job prevents downstream benchmark jobs from being
        # scheduled/listed individually.
        if: >-
            ${{
              github.event_name == 'push' ||
              contains(github.event.pull_request.labels.*.name, 'run/benchmarks')
            }}
        outputs:
            sha: ${{ steps.base.outputs.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Determine benchmark base commit
              id: base
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
                      BASE_SHA="$(git merge-base HEAD^2 HEAD^1)"
                    else
                      git fetch --no-tags origin "$BASE_REF"
                      BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"
                    fi
                  else
                    BASE_SHA=""
                  fi
                  echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

    micro-benchmark:
        name: Microbenchmarks (perf)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: resolve-base
        if: ${{ always() && needs.resolve-base.result == 'success' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: false
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: pip install -r scripts/benchmarks/requirements.txt
            - uses: actions/checkout@v4
              if: ${{ needs.resolve-base.outputs.sha != '' }}
              with:
                  ref: ${{ needs.resolve-base.outputs.sha }}
                  path: benchmark-base-source
            - name: Run base microbenchmarks
              if: ${{ needs.resolve-base.outputs.sha != '' }}
              working-directory: benchmark-base-source
              run: |
                  if [ -f scripts/benchmarks/micro/run.py ]; then
                    python3 scripts/benchmarks/micro/run.py --output-dir ../benchmark-output/microbenchmarks/baseline
                  elif [ -f scripts/benchmarks/microbenchmarks.py ]; then
                    python3 scripts/benchmarks/microbenchmarks.py --output-dir ../benchmark-output/microbenchmarks/baseline
                  elif [ -f scripts/benchmarks/benchmark_yamcs_streams.py ] && grep -q -- "--only" scripts/benchmarks/benchmark_yamcs_streams.py; then
                    python3 scripts/benchmarks/benchmark_yamcs_streams.py --only micro --output-dir ../benchmark-output/microbenchmarks/baseline
                  fi
            - name: Run microbenchmarks
              run: python3 scripts/benchmarks/micro/run.py --output-dir benchmark-output/microbenchmarks/head
            - uses: actions/upload-artifact@v4
              with:
                  name: benchmark-micro
                  path: benchmark-output/microbenchmarks
                  retention-days: 14

    scenario-benchmark:
        name: Simulator benchmarks (perf)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: resolve-base
        if: ${{ always() && needs.resolve-base.result == 'success' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: false
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: pip install -r scripts/benchmarks/requirements.txt
            - name: Install canonical Yamcs demo
              run: git clone --depth 1 --branch chore/yamcs-5.13.7 https://github.com/jaops-space/grafana-yamcs-demo.git /tmp/yamcs-demo
            - name: Start canonical Yamcs and simulator
              run: |
                  docker compose -f /tmp/yamcs-demo/docker/docker-compose.yml -f "$GITHUB_WORKSPACE/scripts/benchmarks/canonical-ports.yml" up -d --build
                  timeout 180 bash -c 'until curl -fsS http://localhost:8093/api/instances/demo >/dev/null; do sleep 2; done'
            - uses: actions/checkout@v4
              if: ${{ needs.resolve-base.outputs.sha != '' }}
              with:
                  ref: ${{ needs.resolve-base.outputs.sha }}
                  path: benchmark-base-source
            - name: Run base simulator scenario
              if: ${{ needs.resolve-base.outputs.sha != '' }}
              working-directory: benchmark-base-source
              run: |
                  if [ -f scripts/benchmarks/workload.json ] && cmp -s scripts/benchmarks/workload.json "$GITHUB_WORKSPACE/scripts/benchmarks/workload.json"; then
                    python3 scripts/benchmarks/simulator/run.py --no-simulator --output-dir ../benchmark-output/simulator/baseline
                  else
                    echo "Skipping PR-base simulator benchmark: workload semver or parameters differ."
                  fi
            - name: Run simulator scenario
              env:
                  BASELINE_COMMIT: ${{ needs.resolve-base.outputs.sha }}
              run: |
                  if [ -n "$BASELINE_COMMIT" ]; then
                    python3 scripts/benchmarks/simulator/run.py \
                      --no-simulator \
                      --output-dir benchmark-output/simulator/head \
                      --baseline-results benchmark-output/simulator/baseline/simulator.json \
                      --baseline-commit "$BASELINE_COMMIT"
                  else
                    python3 scripts/benchmarks/simulator/run.py \
                      --no-simulator \
                      --output-dir benchmark-output/simulator/head
                  fi
            - name: Collect scenario logs
              if: always()
              run: docker compose -f /tmp/yamcs-demo/docker/docker-compose.yml -f scripts/benchmarks/canonical-ports.yml logs > benchmark-output/simulator/yamcs.log || true
            - name: Stop scenario services
              if: always()
              run: docker compose -f /tmp/yamcs-demo/docker/docker-compose.yml -f scripts/benchmarks/canonical-ports.yml down -v || true
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: benchmark-scenario
                  path: benchmark-output/simulator
                  retention-days: 14

    grafana-benchmark:
        name: Grafana Live benchmarks (perf)
        runs-on: ubuntu-latest
        timeout-minutes: 35
        needs: resolve-base
        if: ${{ always() && needs.resolve-base.result == 'success' }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v3
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: false
            - run: pnpm install --frozen-lockfile --prefer-offline
            - name: Install canonical Yamcs demo
              run: git clone --depth 1 --branch chore/yamcs-5.13.7 https://github.com/jaops-space/grafana-yamcs-demo.git /tmp/yamcs-demo
            - name: Start canonical Yamcs and simulator
              run: |
                  docker compose -f /tmp/yamcs-demo/docker/docker-compose.yml -f "$GITHUB_WORKSPACE/scripts/benchmarks/canonical-ports.yml" up -d --build
                  timeout 180 bash -c 'until curl -fsS http://localhost:8093/api/instances/demo >/dev/null; do sleep 2; done'
            - uses: actions/checkout@v4
              if: ${{ needs.resolve-base.outputs.sha != '' }}
              with:
                  ref: ${{ needs.resolve-base.outputs.sha }}
                  path: benchmark-base-source
            - name: Run base Grafana benchmark
              if: ${{ needs.resolve-base.outputs.sha != '' }}
              working-directory: benchmark-base-source
              run: |
                  if [ -f tests/benchmark/streaming.benchmark.spec.ts ] && [ -f scripts/benchmarks/workload.json ] && cmp -s scripts/benchmarks/workload.json "$GITHUB_WORKSPACE/scripts/benchmarks/workload.json"; then
                    pnpm install --frozen-lockfile --prefer-offline
                    pnpm run build
                    go run github.com/magefile/mage -v buildAll
                    go build -o dist/gpx_grafana_yamcs_jaops_linux_amd64 -tags "arrow_json_stdlib benchmark" ./pkg
                    docker compose down -v || true
                    ANONYMOUS_AUTH_ENABLED=true DEVELOPMENT=false docker compose up -d --build grafana
                    timeout 120 bash -c 'until curl -fsS http://localhost:3000/api/health >/dev/null; do sleep 2; done'
                    pnpm exec playwright install chromium --with-deps
                    GRAFANA_BENCHMARK_OUTPUT="../benchmark-output/grafana/baseline/grafana.json" pnpm run bench:grafana
                    docker compose down -v
                  else
                    echo "Skipping PR-base Grafana benchmark: workload semver or parameters differ."
                  fi
            - name: Build plugin for Grafana benchmark
              run: |
                  pnpm run build
                  go run github.com/magefile/mage -v buildAll
                  go build -o dist/gpx_grafana_yamcs_jaops_linux_amd64 -tags "arrow_json_stdlib benchmark" ./pkg
            - name: Run Grafana benchmark
              run: |
                  docker compose down -v || true
                  ANONYMOUS_AUTH_ENABLED=true DEVELOPMENT=false docker compose up -d --build grafana
                  timeout 120 bash -c 'until curl -fsS http://localhost:3000/api/health >/dev/null; do sleep 2; done'
                  pnpm exec playwright install chromium --with-deps
                  GRAFANA_BENCHMARK_EXPECT_GROUPED_STREAMS=12 \
                    GRAFANA_BENCHMARK_VERIFY_FIELDS=1 \
                    GRAFANA_BENCHMARK_PLUGIN_COMMIT="$GITHUB_SHA" \
                    GRAFANA_BENCHMARK_OUTPUT="$PWD/benchmark-output/grafana/head/grafana.json" pnpm run bench:grafana
            - uses: actions/checkout@v4
              if: ${{ github.event_name == 'pull_request' && github.head_ref == 'demo/dashboard-refresh' }}
              with:
                  # Last #90 revision before #91's single-stream-per-query change.
                  ref: f13454edbe0345f3860c9e657837bab407859b1f
                  path: benchmark-pre-batch-source
            - name: Build pre-batching plugin
              if: ${{ github.event_name == 'pull_request' && github.head_ref == 'demo/dashboard-refresh' }}
              working-directory: benchmark-pre-batch-source
              run: |
                  # The 72-stream workload exposed a subscription-map race in #90.
                  # Backport only that safety fix and the missing SingleValue
                  # benchmark counter; keep the old per-parameter stream logic.
                  git fetch --no-tags --depth=1 origin 404a1580cd5b1c22c80d5c96e535e3f75f6f620a
                  git show --format= 404a1580cd5b1c22c80d5c96e535e3f75f6f620a -- \
                    pkg/source/endpoint_parameter.go pkg/source/endpoint.go \
                    pkg/yamcs/client/parameter_subscription.go pkg/plugin/datasource_run_debug.go | git apply
                  git apply "$GITHUB_WORKSPACE/scripts/benchmarks/pre-batch-single-stats.patch"
                  pnpm install --frozen-lockfile --prefer-offline
                  pnpm run build
                  go run github.com/magefile/mage -v buildAll
                  go build -o dist/gpx_grafana_yamcs_jaops_linux_amd64 -tags "arrow_json_stdlib benchmark" ./pkg
            - name: Run same grouped workload against pre-batching plugin
              if: ${{ github.event_name == 'pull_request' && github.head_ref == 'demo/dashboard-refresh' }}
              run: |
                  docker logs jaops-yamcs-app > benchmark-output/grafana/grafana-head.log 2>&1 || true
                  docker compose down -v
                  cp -R benchmark-pre-batch-source/dist/. dist/
                  ANONYMOUS_AUTH_ENABLED=true DEVELOPMENT=false docker compose up -d --build grafana
                  timeout 120 bash -c 'until curl -fsS http://localhost:3000/api/health >/dev/null; do sleep 2; done'
                  GRAFANA_BENCHMARK_PANEL_COUNTS=1 \
                    GRAFANA_BENCHMARK_EXPECT_GROUPED_STREAMS=72 \
                    GRAFANA_BENCHMARK_PLUGIN_COMMIT="f13454e+subscription-locking-404a158+single-stats" \
                    GRAFANA_BENCHMARK_OUTPUT="$PWD/benchmark-output/grafana/pre-batch/grafana.json" pnpm run bench:grafana
            - name: Collect Grafana logs
              if: always()
              run: |
                  docker logs jaops-yamcs-app > benchmark-output/grafana/grafana.log 2>&1 || true
                  docker compose -f /tmp/yamcs-demo/docker/docker-compose.yml -f scripts/benchmarks/canonical-ports.yml logs > benchmark-output/grafana/yamcs.log || true
            - name: Stop Grafana services
              if: always()
              run: |
                  docker compose down -v || true
                  docker compose -f /tmp/yamcs-demo/docker/docker-compose.yml -f scripts/benchmarks/canonical-ports.yml down -v || true
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: benchmark-grafana
                  path: benchmark-output/grafana
                  retention-days: 14

    benchmark-report:
        name: Create report
        runs-on: ubuntu-latest
        needs: [resolve-base, micro-benchmark, scenario-benchmark, grafana-benchmark]
        if: >-
            ${{
              always() &&
              github.event_name == 'pull_request' &&
              needs.resolve-base.result == 'success'
            }}
        outputs:
            should_comment: ${{ steps.benchmark-status.outputs.should_comment }}
            should_fail: ${{ steps.benchmark-status.outputs.should_fail }}
        # Read-only: this job checks out the PR ref and runs scripts/benchmarks/report.py,
        # which is PR-controlled code. It must never hold write tokens (see benchmark-publish).
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: pip install -r scripts/benchmarks/requirements.txt
            - uses: actions/download-artifact@v4
              with:
                  name: benchmark-scenario
                  path: artifacts/simulator
            - uses: actions/download-artifact@v4
              with:
                  name: benchmark-micro
                  path: artifacts/microbenchmarks
            - uses: actions/download-artifact@v4
              with:
                  name: benchmark-grafana
                  path: artifacts/grafana
            - name: Require pre-batching comparison for dashboard PR
              if: ${{ github.head_ref == 'demo/dashboard-refresh' }}
              run: test -s artifacts/grafana/pre-batch/grafana.json
            - name: Build benchmark report
              env:
                  BASELINE_COMMIT: ${{ needs.resolve-base.outputs.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -n "$BASELINE_COMMIT" ]; then
                    python3 scripts/benchmarks/report.py \
                      --output-dir benchmark-output \
                      --simulator-results artifacts/simulator/head/simulator.json \
                      --micro-results artifacts/microbenchmarks/head/microbenchmarks.json \
                      --grafana-results artifacts/grafana/head/grafana.json \
                      --baseline-simulator-results artifacts/simulator/baseline/simulator.json \
                      --baseline-micro-results artifacts/microbenchmarks/baseline/microbenchmarks.json \
                      --baseline-grafana-results artifacts/grafana/baseline/grafana.json \
                      --pre-batch-grafana-results artifacts/grafana/pre-batch/grafana.json \
                      --baseline-commit "$BASELINE_COMMIT" \
                      --run-url "$RUN_URL"
                  else
                    python3 scripts/benchmarks/report.py \
                      --output-dir benchmark-output \
                      --simulator-results artifacts/simulator/head/simulator.json \
                      --micro-results artifacts/microbenchmarks/head/microbenchmarks.json \
                      --grafana-results artifacts/grafana/head/grafana.json \
                      --pre-batch-grafana-results artifacts/grafana/pre-batch/grafana.json \
                      --run-url "$RUN_URL"
                  fi
            - name: Read benchmark status
              id: benchmark-status
              run: |
                  python3 - <<'PY' >> "$GITHUB_OUTPUT"
                  import json
                  with open("benchmark-output/benchmark-status.json", encoding="utf-8") as fp:
                      report = json.load(fp)
                  status = report.get("status", "pass")
                  print(f"status={status}")
                  print(f"should_comment={str(report.get('should_comment', True)).lower()}")
                  print(f"should_fail={str(report.get('should_fail', status == 'fail')).lower()}")
                  PY
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: benchmark-${{ github.run_id }}
                  path: benchmark-output
                  retention-days: 14
            - name: Fail benchmark on threshold failure
              if: ${{ steps.benchmark-status.outputs.should_fail == 'true' }}
              run: exit 1

    # Separate from benchmark-report on purpose: benchmark-report checks out the PR ref and
    # executes PR-controlled code (scripts/benchmarks/report.py), so it must stay read-only.
    # This job only downloads the already-produced artifact and talks to the GitHub API -
    # no PR code is checked out or executed here - so it's safe to grant it write access.
    benchmark-publish:
        name: Publish report
        runs-on: ubuntu-latest
        needs: benchmark-report
        if: >-
            ${{
              always() &&
              github.event_name == 'pull_request' &&
              needs.benchmark-report.outputs.should_comment == 'true'
            }}
        permissions:
            actions: read
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: benchmark-${{ github.run_id }}
                  path: benchmark-output
            - name: Publish benchmark plot images for PR artifacts
              id: publish-plots
              continue-on-error: true
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');
                      const plotsDir = path.join('benchmark-output', 'plots');
                      const allPlots = fs.existsSync(plotsDir)
                        ? fs.readdirSync(plotsDir).filter((name) => name.endsWith('.png'))
                        : [];
                      if (allPlots.length === 0) {
                        core.setOutput('plots-base-url', '');
                        return;
                      }
                      const {owner, repo} = context.repo;
                      const prNumber = context.payload.pull_request.number;
                      const runId = context.runId;
                      const branch = `benchmark-artifacts-pr-${prNumber}`;
                      const prefix = `benchmark/run-${runId}/plots`;
                      let parentSha;
                      try {
                        const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
                        parentSha = ref.data.object.sha;
                      } catch (error) {
                        if (error.status !== 404) throw error;
                      }
                      const treeEntries = [];
                      for (const plot of allPlots) {
                        const source = path.join(plotsDir, plot);
                        const blob = await github.rest.git.createBlob({
                          owner, repo,
                          content: fs.readFileSync(source).toString('base64'),
                          encoding: 'base64',
                        });
                        treeEntries.push({path: `${prefix}/${plot}`, mode: '100644', type: 'blob', sha: blob.data.sha});
                      }
                      const tree = await github.rest.git.createTree({owner, repo, tree: treeEntries});
                      const commit = await github.rest.git.createCommit({
                        owner, repo,
                        message: `Add benchmark plots for run ${runId}`,
                        tree: tree.data.sha,
                        parents: parentSha ? [parentSha] : [],
                      });
                      if (parentSha) {
                        await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha});
                      } else {
                        await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha});
                      }
                      core.setOutput('plots-base-url', `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${prefix}`);
            - name: Comment benchmark result
              continue-on-error: true
              uses: actions/github-script@v8
              env:
                  PLOTS_BASE_URL: ${{ steps.publish-plots.outputs.plots-base-url }}
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- jaops-yamcs-benchmark-report -->';
                      const plotsBaseUrl = process.env.PLOTS_BASE_URL || '';
                      let body = fs.readFileSync('benchmark-output/benchmark-comment.md', 'utf8');
                      if (plotsBaseUrl) {
                        body = body.replaceAll('benchmark-output/plots/', `${plotsBaseUrl}/`);
                      }
                      const {owner, repo} = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
                      const existingComments = comments.filter((comment) => comment.body && comment.body.includes(marker));
                      const existing = existingComments[0];
                      if (existing) {
                        await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
                        for (const duplicate of existingComments.slice(1)) {
                          await github.rest.issues.deleteComment({owner, repo, comment_id: duplicate.id});
                        }
                      } else {
                        await github.rest.issues.createComment({owner, repo, issue_number, body});
                      }
