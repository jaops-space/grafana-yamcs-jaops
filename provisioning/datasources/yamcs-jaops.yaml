apiVersion: 1
prune: true

datasources:
    - name: JAOPS Yamcs Datasource
      uid: jaops-yamcs-main
      type: jaops-yamcs-datasource
      access: proxy
      orgId: 1
      isDefault: true
      editable: true
      version: 11
      jsonData:
          hosts:
              canonical-host:
                  name: Yamcs Demo
                  description: Local Yamcs Demo on port 8093
                  path: docker.gateway:8093
                  tlsEnabled: false
                  tlsInsecure: false
                  authEnabled: false
                  username: admin
                  protobuf: true
          endpoints:
              demo_realtime:
                  name: Yamcs Demo RT
                  description: Yamcs Demo realtime processor
                  host: canonical-host
                  instance: demo
                  processor: realtime
